name: CI/CD - CuidadoSeguro Kafka

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cuidado-seguro-kafka
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Compile with Maven
        run: ./mvnw --batch-mode compile

      - name: Test with Maven
        run: ./mvnw --batch-mode test

      - name: Configure Git env
        run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}, ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}-cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}-cache,mode=max
          pull: true

  integrate:
    needs: docker
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        uses: docker/compose-action@v3
        with:
          file: docker-compose.yml
          parse-images: true

      - name: Start Kafka and Zookeeper
        run: docker compose up -d zookeeper kafka kafka-ui
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Wait for Kafka to be ready
        run: |
          for i in {1..30}; do
            if docker exec kafka kafka-topics --list --bootstrap-server localhost:9092 > /dev/null 2>&1; then
              echo "Kafka is ready"
              break
            fi
            echo "Waiting for Kafka... ($i/30)"
            sleep 5
          done

      - name: Run Kafka microservice integration test
        run: ./mvnw --batch-mode spring-boot:run -Dspring-boot.run.arguments="--spring.kafka.bootstrap-servers=localhost:9092" &
        timeout-minutes: 5
        env:
          SPRING_KAFKA_BOOTSTRAP_SERVERS: localhost:9092

      - name: Stop Kafka services
        if: always()
        run: docker compose down