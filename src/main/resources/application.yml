server:
  port: 8888

spring:
  kafka:
    # La aplicación Java se ejecuta localmente en VS Code; Kafka broker expone localhost:9092.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: signos-vitales
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      missing-topics-fatal: false
      ack-mode: record

notificacion:
  service:
    # Kafka app local -> Notification Service local.
    base-url: ${NOTIFICACION_SERVICE_URL:http://localhost:8089}

logging:
  level:
    cl.duoc.dsy1107.demo: INFO
    org.springframework.kafka: INFO
